name: Deploy Mini App To GitHub Pages

on:
  push:
    branches:
      - main
      - codex/AVPN-1
      - codex/F-1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: miniapp-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static Mini App
        shell: bash
        run: |
          test -d apps/miniapp/compat
          touch apps/miniapp/compat/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/miniapp/compat

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
