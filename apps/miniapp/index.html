<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AllyVPN Mini App</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0f0d12;
        color: #ffffff;
        font-family: "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .miniapp-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top center, rgba(124, 74, 204, 0.16), transparent 32%),
          #0f0d12;
      }

      .miniapp-boot__panel {
        width: min(100%, 380px);
        padding: 24px;
        border-radius: 24px;
        border: 1px solid rgba(182, 153, 230, 0.18);
        background: rgba(23, 20, 28, 0.94);
        box-shadow: 0 20px 50px rgba(8, 7, 10, 0.32);
      }

      .miniapp-boot__badge {
        display: inline-flex;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(124, 74, 204, 0.18);
        color: #b699e6;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .02em;
      }

      .miniapp-boot__title {
        margin: 16px 0 8px;
        font-size: 28px;
        line-height: 1.05;
      }

      .miniapp-boot__text {
        margin: 0;
        color: #b9b1c7;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="miniapp-boot">
        <div class="miniapp-boot__panel">
          <span class="miniapp-boot__badge">AllyVPN Mini</span>
          <h1 class="miniapp-boot__title">Загрузка интерфейса</h1>
          <p class="miniapp-boot__text">Если экран не обновится, проблема в совместимости встроенного браузера Telegram. В этой сборке уже включён fallback и legacy-режим.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
